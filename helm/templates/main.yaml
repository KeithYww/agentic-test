apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentic-qa.fullname" . }}
  labels:
    {{- include "agentic-qa.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "agentic-qa.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "agentic-qa.name" . }}
    spec:
      containers:
        - name: agentic-qa
          image: {{ .Values.image.all }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
            - containerPort: 8002
            - containerPort: 8003
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: {{ include "agentic-qa.fullname" . }}-config
            - secretRef:
                name: {{ include "agentic-qa.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-qa.fullname" . }}
  labels:
    {{- include "agentic-qa.labels" . | nindent 4 }}
  annotations:
    service.beta.kubernetes.io/alibaba-cloud-loadbalancer-connection-idle-timeout: "1800"
spec:
  type: {{ .Values.serviceType }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ include "agentic-qa.name" . }}
  ports:
    - port: 8000
      targetPort: 8000
