apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-qa.fullname" . }}-secrets
  labels:
    {{- include "agentic-qa.labels" . | nindent 4 }}
type: Opaque
stringData:
  PHOTON_API_KEY: {{ .Values.secrets.photon_api_key | quote }}
  FEISHU_APP_ID: {{ .Values.secrets.feishu_app_id | quote }}
  FEISHU_APP_SECRET: {{ .Values.secrets.feishu_app_secret | quote }}
  MEEGO_PLUGIN_ID: {{ .Values.secrets.meego_plugin_id | quote }}
  MEEGO_PLUGIN_SECRET: {{ .Values.secrets.meego_plugin_secret | quote }}
  MEEGO_USER_KEY: {{ .Values.secrets.meego_user_key | quote }}
  ORCHESTRATOR_API_KEY: {{ .Values.secrets.orchestrator_api_key | quote }}
  DASHBOARD_USERNAME: {{ .Values.secrets.dashboard_username | quote }}
  DASHBOARD_PASSWORD: {{ .Values.secrets.dashboard_password | quote }}
  DASHBOARD_JWT_SECRET: {{ .Values.secrets.dashboard_jwt_secret | quote }}
  FEISHU_BOT_WEBHOOK_URL: {{ .Values.secrets.feishu_bot_webhook_url | quote }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ .Values.secrets.otel_exporter_otlp_headers | quote }}
  OSS_ACCESS_KEY_ID: {{ .Values.secrets.oss_access_key_id | quote }}
  OSS_ACCESS_KEY_SECRET: {{ .Values.secrets.oss_access_key_secret | quote }}
  KB_API_KEY: {{ .Values.secrets.kb_api_key | quote }}
