[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
# Smoke tests need the docker-compose.smoke.yml stack up, and live_llm tests need a real
# PHOTON_API_KEY and make real network calls, so both are excluded from a bare run by
# default; opt in locally with -m smoke or -m live_llm.
addopts = -m "not smoke and not live_llm"
markers =
    smoke: hermetic end-to-end checks driving the orchestrator + agents in docker-compose with mocked external boundaries
    live_llm: real network calls to the Photon relay verifying every configured model/thinking-level combination works
