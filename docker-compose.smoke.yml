# Hermetic smoke topology: real orchestrator + the QA agents (all our own code,
# real Photon API relay calls), with only the external boundaries mocked (Jira MCP,
# Jira REST, Zephyr, Qdrant + embedding). A mock test-execution agent stands in for
# the VM-hosted real executors so the /execute-tests + incident-creation flow can run
# end to end.
#
# Prerequisite: the shared base image must be built first, since every service
# here derives from it:
#   docker build -t agentic-qa-base:latest -f Dockerfile.base .
#
# Then:  docker compose -f docker-compose.smoke.yml up --build --wait
#
# PHOTON_API_KEY must be exported in the environment (real Photon API relay calls).

# Shared environment for the execution agents. PORT/EXTERNAL_PORT are set per
# service below, matching each agent's real dev default port from config.py
# (see e.g. RequirementsReviewAgentConfig.PORT), so the orchestrator's
# REMOTE_EXECUTION_AGENT_HOSTS x AGENT_DISCOVERY_PORTS scan below exercises the
# same multi-port discovery path as local dev, not a degenerate single-port one.
x-agent-env: &agent-env
  KB_BASE_URL: "http://qa_boundary_mock:8096"
  KB_API_KEY: "smoke-kb"
  KB_QUERY_ENABLED: "true"
  JIRA_MCP_SERVER_URL: "http://jira_mcp_mock:9000/sse"
  FEISHU_MCP_SERVER_URL: "http://feishu_mcp_mock:9010/sse"
  JIRA_URL: "http://jira_rest_mock:8080"
  JIRA_USERNAME: "smoke"
  JIRA_API_TOKEN: "smoke-token"
  ZEPHYR_BASE_URL: "http://zephyr_mock:8090"
  ZEPHYR_API_TOKEN: "smoke-token"
  TEST_MANAGEMENT_SYSTEM: "zephyr"
  # Meego credentials for the Requirements Review agent's review-comment write-back.
  MEEGO_BASE_URL: "http://meego_mock:8095"
  MEEGO_PLUGIN_ID: "smoke"
  MEEGO_PLUGIN_SECRET: "smoke-secret"
  MEEGO_PROJECT_KEY: "SMOKE"
  PROMPT_INJECTION_CHECK_ENABLED: "false"
  PHOTON_API_KEY: "${PHOTON_API_KEY}"
  PHOTON_API_BASE_URL: "${PHOTON_API_BASE_URL:-https://llm.example.com}"
  # Points at the OTLP mock so the smoke suite can assert spans are actually exported.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel_collector_mock:9020/v1/traces"

# Agents serve their A2A card as soon as they are ready to take tasks. Reads
# $PORT so it works for each service's own port (see per-service PORT below).
x-agent-healthcheck: &agent-healthcheck
  test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://localhost:' + os.environ['PORT'] + '/.well-known/agent-card.json')\""]
  interval: 5s
  timeout: 5s
  retries: 24
  start_period: 20s

x-mock-dependencies: &mock-dependencies
  qa_boundary_mock:
    condition: service_healthy
  jira_mcp_mock:
    condition: service_healthy
  jira_rest_mock:
    condition: service_healthy
  zephyr_mock:
    condition: service_healthy
  feishu_mcp_mock:
    condition: service_healthy
  feishu_api_mock:
    condition: service_healthy
  meego_mock:
    condition: service_healthy
  otel_collector_mock:
    condition: service_healthy

services:
  qa_boundary_mock:
    image: smoke-mocks:latest
    pull_policy: never
    command: ["uvicorn", "mocks.qa_boundary_mock:app", "--host", "0.0.0.0", "--port", "8096"]
    ports:
      - "8096:8096"
    networks:
      default:
        aliases: ["smokearchive.qa_boundary_mock"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8096/__recorded')"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The four recording mocks share one image; only jira_mcp_mock builds it, the
  # others reference the tag so it is built exactly once.
  jira_mcp_mock:
    build:
      context: .
      dockerfile: tests/smoke/mocks/Dockerfile
    image: smoke-mocks:latest
    command: ["uvicorn", "mocks.jira_mcp_mock:app", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/__recorded')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  jira_rest_mock:
    image: smoke-mocks:latest
    pull_policy: never
    command: ["uvicorn", "mocks.jira_rest_mock:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/__recorded')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  zephyr_mock:
    image: smoke-mocks:latest
    pull_policy: never
    command: ["uvicorn", "mocks.zephyr_mock:app", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/__recorded')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  qdrant_mock:
    image: smoke-mocks:latest
    pull_policy: never
    command: ["uvicorn", "mocks.qdrant_mock:app", "--host", "0.0.0.0", "--port", "6333"]
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6333/__recorded')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  feishu_mcp_mock:
    image: smoke-mocks:latest
    pull_policy: never
    command: ["uvicorn", "mocks.feishu_mcp_mock:app", "--host", "0.0.0.0", "--port", "9010"]
    ports:
      - "9010:9010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9010/__recorded')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  meego_mock:
    image: smoke-mocks:latest
    pull_policy: never
    command: ["uvicorn", "mocks.meego_mock:app", "--host", "0.0.0.0", "--port", "8095"]
    ports:
      - "8095:8095"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/__recorded')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  feishu_api_mock:
    image: smoke-mocks:latest
    pull_policy: never
    command: ["uvicorn", "mocks.feishu_api_mock:app", "--host", "0.0.0.0", "--port", "8092"]
    ports:
      - "8092:8092"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/__recorded')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  otel_collector_mock:
    image: smoke-mocks:latest
    pull_policy: never
    command: ["uvicorn", "mocks.otel_collector_mock:app", "--host", "0.0.0.0", "--port", "9020"]
    ports:
      - "9020:9020"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9020/__recorded')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  requirements_review:
    build:
      context: .
      dockerfile: agents/requirements_review/Dockerfile
    environment:
      <<: *agent-env
      PORT: "8001"
      EXTERNAL_PORT: "8001"
      AGENT_BASE_URL: "http://requirements_review"
    depends_on: *mock-dependencies
    healthcheck: *agent-healthcheck

  test_case_generation:
    build:
      context: .
      dockerfile: agents/test_case_generation/Dockerfile
    environment:
      <<: *agent-env
      PORT: "8002"
      EXTERNAL_PORT: "8002"
      AGENT_BASE_URL: "http://test_case_generation"
    depends_on: *mock-dependencies
    healthcheck: *agent-healthcheck

  test_case_classification:
    build:
      context: .
      dockerfile: agents/test_case_classification/Dockerfile
    environment:
      <<: *agent-env
      PORT: "8003"
      EXTERNAL_PORT: "8003"
      AGENT_BASE_URL: "http://test_case_classification"
    depends_on: *mock-dependencies
    healthcheck: *agent-healthcheck

  test_case_review:
    build:
      context: .
      dockerfile: agents/test_case_review/Dockerfile
    environment:
      <<: *agent-env
      PORT: "8004"
      EXTERNAL_PORT: "8004"
      AGENT_BASE_URL: "http://test_case_review"
    depends_on: *mock-dependencies
    healthcheck: *agent-healthcheck

  incident_creation:
    build:
      context: .
      dockerfile: agents/incident_creation/Dockerfile
    environment:
      <<: *agent-env
      PORT: "8007"
      EXTERNAL_PORT: "8007"
      AGENT_BASE_URL: "http://incident_creation"
      QDRANT_URL: "http://qdrant_mock"
      QDRANT_PORT: "6333"
      # The duplicate search embeds its query once the tickets collection exists
      # (the concurrently running RAG sync creates it).
      EMBEDDING_SERVICE_URL: "http://qdrant_mock:6333"
    depends_on:
      <<: *mock-dependencies
      qdrant_mock:
        condition: service_healthy
    healthcheck: *agent-healthcheck

  # Mock test-execution agent (real ones run on VMs, out of this repo). Returns a
  # canned failed result so /execute-tests drives the incident-creation flow.
  # No real dev default port to sync to (this mock has no local-dev counterpart);
  # keeps using 8001, distinct from the other agents' hostnames.
  execution_agent:
    build:
      context: .
      dockerfile: tests/smoke/mocks/Dockerfile.execution_agent
    environment:
      <<: *agent-env
      PORT: "8001"
      EXTERNAL_PORT: "8001"
      AGENT_BASE_URL: "http://execution_agent"
    depends_on: *mock-dependencies
    healthcheck: *agent-healthcheck

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    command: ["gunicorn", "-w", "1", "-k", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "orchestrator.main:orchestrator_app"]
    # Real lark-cli would call the real Feishu Open API; the hermetic smoke stack must not
    # do that, so a fake shim (tests/smoke/mocks/lark_cli_shim.sh) is mounted over the real
    # install for this service only (see common/services/feishu_doc_service.py).
    volumes:
      - ./tests/smoke/mocks/lark_cli_shim.sh:/usr/local/bin/lark-cli:ro
    environment:
      TC_REPAIR_MAX_TOKENS: "8192"
      REQUIREMENT_REVIEW_ENABLED: "${REQUIREMENT_REVIEW_ENABLED:-false}"
      OSS_ARCHIVE_ENABLED: "${OSS_ARCHIVE_ENABLED:-false}"
      OSS_ENDPOINT: "http://qa_boundary_mock:8096"
      OSS_BUCKET: "smokearchive"
      OSS_REGION: "cn-hangzhou"
      OSS_ACCESS_KEY_ID: "smoke-oss"
      OSS_ACCESS_KEY_SECRET: "smoke-oss-secret"
      FEISHU_BITABLE_SYNC_ENABLED: "true"
      ORCHESTRATOR_HOST: "0.0.0.0"
      ORCHESTRATOR_PORT: "8000"
      REMOTE_EXECUTION_AGENT_HOSTS: "http://requirements_review,http://test_case_generation,http://test_case_classification,http://test_case_review,http://incident_creation,http://execution_agent"
      # Matches the real dev/prod range (README/cloudbuild default 8001-8007),
      # so discovery scans the same host x port cross-product as local dev.
      AGENT_DISCOVERY_PORTS: "8001-8007"
      ORCHESTRATOR_API_KEY: "smoke-api-key"
      DASHBOARD_USERNAME: "smoke"
      DASHBOARD_PASSWORD: "smoke-pass"
      DASHBOARD_JWT_SECRET: "smoke-jwt-secret"
      PROMPT_INJECTION_CHECK_ENABLED: "false"
      PHOTON_API_KEY: "${PHOTON_API_KEY}"
      PHOTON_API_BASE_URL: "${PHOTON_API_BASE_URL:-https://llm.example.com}"
      # The /execute-tests flow makes the orchestrator a test-management client.
      TEST_MANAGEMENT_SYSTEM: "zephyr"
      ZEPHYR_BASE_URL: "http://zephyr_mock:8090"
      ZEPHYR_API_TOKEN: "smoke-token"
      # Meego credentials for the /story-ready-for-test-case-generation write-back.
      MEEGO_BASE_URL: "http://meego_mock:8095"
      MEEGO_PLUGIN_ID: "smoke"
      MEEGO_PLUGIN_SECRET: "smoke-secret"
      MEEGO_PROJECT_KEY: "SMOKE"
      # The /update-rag-db flow makes the orchestrator a Jira REST and vector DB client.
      JIRA_URL: "http://jira_rest_mock:8080"
      JIRA_USERNAME: "smoke"
      JIRA_API_TOKEN: "smoke-token"
      QDRANT_URL: "http://qdrant_mock"
      QDRANT_PORT: "6333"
      EMBEDDING_SERVICE_URL: "http://qdrant_mock:6333"
      FEISHU_API_BASE_URL: "http://feishu_api_mock:8092"
      FEISHU_APP_ID: "smoke"
      FEISHU_APP_SECRET: "smoke-secret"
      # Points at the OTLP mock so the smoke suite can assert spans are actually exported.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel_collector_mock:9020/v1/traces"
    ports:
      - "8000:8000"
    depends_on:
      qa_boundary_mock:
        condition: service_healthy
      zephyr_mock:
        condition: service_healthy
      meego_mock:
        condition: service_healthy
      qdrant_mock:
        condition: service_healthy
      feishu_api_mock:
        condition: service_healthy
      otel_collector_mock:
        condition: service_healthy
      requirements_review:
        condition: service_healthy
      test_case_generation:
        condition: service_healthy
      test_case_classification:
        condition: service_healthy
      test_case_review:
        condition: service_healthy
      incident_creation:
        condition: service_healthy
      execution_agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
